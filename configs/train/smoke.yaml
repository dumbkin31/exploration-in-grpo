# End-to-end plumbing test on the real layout (default: research_1gpu + plan B LoRA; whatever layout/memory
# you override): 20 MATH problems, 2 steps, groups of 4 (2 std + 2 CUTS), 512-token responses.
# Two steps are the minimum: the |S_t| statistics of step 1 are summarised at step 2.
hydra:
  searchpath:
    - pkg://verl.trainer.config
defaults:
  - base_grpo
  - _self_

mixed_cuts:
  group_size: 4
  n_std: 2
  n_cuts: 2
  dump_samples_per_step: 2

data:
  train_files: ${paths.data_dir}/smoke_train.parquet
  val_files: ${paths.data_dir}/smoke_val.parquet
  val_max_samples: 8
  train_batch_size: 4
  max_prompt_length: 512
  max_response_length: 512

actor_rollout_ref:
  actor:
    ppo_mini_batch_size: 4
    ppo_max_token_len_per_gpu: 2048
  ref:
    log_prob_max_token_len_per_gpu: 2048
  rollout:
    max_model_len: 1536
    max_num_batched_tokens: 2048
    log_prob_max_token_len_per_gpu: 2048
    agent:
      num_workers: 2
    val_kwargs:
      n: 2

trainer:
  total_training_steps: 2
  test_freq: 1
  # save_freq comes from the top-level `save_freq` (default 1) so `save_freq=` overrides still apply

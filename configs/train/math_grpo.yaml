# Arm 1: vanilla GRPO on MATH. Identical to math_mixed_cuts except the group composition:
# all 16 rollouts standard (n_cuts = 0), so both arms spend the same generation budget (D4).
hydra:
  searchpath:
    - pkg://verl.trainer.config
defaults:
  - base_grpo
  - _self_
mixed_cuts:
  enabled: true
  group_size: 16
  n_std: 16
  n_cuts: 0

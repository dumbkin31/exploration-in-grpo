# @package _global_
# Memory plan A' (full fine-tune, manual offload): 4-card layout only (see plan_a_fullft_offload.yaml).
# Memory plan A' (tuning fallback): full fine-tune with verl's MANUAL offload flags instead of
# the FSDP2 CPUOffloadPolicy. Params, grads and the optimizer state move back to the GPUs for
# the actor update (optimizer.step on GPU: faster, but ~7 GB/GPU for the 4-way sharded fp32
# master + grads + Adam, plus activations). Only try after plan A is measured
# (`scripts/profile_memory.py`) and if the CPU AdamW step dominates.
actor_rollout_ref:
  model:
    lora_rank: 0
  actor:
    strategy: fsdp2
    optim:
      lr: 1.0e-6                     # paper (full fine-tuning); ladder: 5e-7 if unstable (006)
    fsdp_config:
      strategy: fsdp2
      offload_policy: false
      param_offload: true            # to CPU between phases; back on GPU for the update
      optimizer_offload: true
      reshard_after_forward: true
  ref:
    fsdp_config:
      strategy: fsdp2
      offload_policy: false
      param_offload: true

# @package _global_
# Layout: one node with 4x RTX 2080 Ti on the `research` account (QoS medium).
# This is one distributed LoRA job: one TP=4 vLLM replica and FSDP2 over 4 ranks. Select with
# MC_LAYOUT=nlp_4gpu; configs/ada.env.sh supplies the LoRA memory plan and matching 4-GPU sbatch flags.
trainer:
  n_gpus_per_node: 4
actor_rollout_ref:
  rollout:
    tensor_model_parallel_size: 4    # one replica across the 4 cards (llm_server.py:554)  [checked]
    gpu_memory_utilization: 0.40     # rollout-phase budget; the actor lives on CPU then (002)
    max_num_seqs: 128
    max_num_batched_tokens: 8192
    agent:
      num_workers: 4
data:
  dataloader_num_workers: 4
ray_kwargs:
  ray_init:
    num_cpus: 40
    object_store_memory: 16000000000 # 16 GB cap; Ray's default (30% of RAM) collides with CPU offload
transfer_queue:
  backend:
    SimpleStorage:
      num_data_storage_units: 8

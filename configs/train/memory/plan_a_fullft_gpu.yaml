# @package _global_
# Memory plan A on ONE H200 (141 GB; decision 017): FULL fine-tune with everything on the GPU, lr 1e-6 constant
# (the paper's full-fine-tuning recipe). The Jarvislabs default (MC_MEMORY_PLAN, configs/jarvis.env.sh); pairs
# with layout=h100_1gpu hardware=h100. Does NOT fit an 80 GB H100 at that layout's vLLM budget (0.60 x 80 = 48
# GB + the ~35 GB below): use plan_b_lora_calibrated_gpu there.
#
# Per-GPU budget (Qwen3-1.7B, 1.72 B parameters; the LoRA arms peaked at 16.1 GB allocated in the update):
#   actor  fp32 params 6.9 GB + Adam m/v 13.8 GB (+ fp32 grads 6.9 GB during the update)   21-28 GB
#   reference: a separate fp32 copy (no adapter to switch off; ref model_dtype fp32)          6.9 GB
#   rollout: vLLM 0.60 x 141 GB = 85 GB beside the actor and the reference                 ~121 GB in all
#   update (vLLM asleep at level 2): 28 + 7 + ~8 GB activations (32k-token micro-batches)    ~43 GB
# Checkpoints hold the fp32 model and the Adam state: ~21 GB each (LoRA: 0.9 GB).
actor_rollout_ref:
  model:
    lora_rank: 0                     # full fine-tune: every parameter trains
  actor:
    strategy: fsdp2
    optim:
      lr: 1.0e-6                     # paper (full fine-tuning)
      lr_scheduler_type: constant    # verl v0.9.0 key (optim/fsdp.yaml:39); no warmup
    fsdp_config:
      strategy: fsdp2
      model_dtype: fp32              # fp32 masters; bf16 compute comes from configs/train/hardware/h100.yaml
      offload_policy: false          # everything on the GPU
      param_offload: false
      optimizer_offload: false
      reshard_after_forward: true    # a no-op on one GPU (world size 1)
    checkpoint:
      save_lora_only: false          # no adapter: model + optimizer
  ref:
    fsdp_config:
      strategy: fsdp2
      offload_policy: false
      param_offload: false

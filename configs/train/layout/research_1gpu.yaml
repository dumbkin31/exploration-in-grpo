# @package _global_
# Layout: ONE RTX 2080 Ti per job on SLURM account `research` / QoS `low` (per user: 1 GPU, 10 CPUs,
# 32 GB host RAM, 1 node per job; docs/decisions/012). This is the DEFAULT layout; it pairs with
# memory=plan_b_lora (plan A needs 27.6 GB of host RAM for the optimizer alone; compose-check refuses it).
#
# Rollout budget: the actor lives in pinned host RAM (FSDP2 CPUOffloadPolicy), so vLLM can take most of
# the card: 0.80 x 11 GiB = 8.8 GiB = 3.44 GB weights + ~1 GB activations/cudagraphs + ~4.3 GB KV
# Measured by `make sbatch-bench` on gnode084 (2026-09-27, job 2719260, V1 runner + CUTS processor):
# util 0.80 -> 4.74 GiB KV = 44,416 tokens (7.2 max-length sequences), rollout peak 8.9 GiB; util 0.85
# starts too (49,360 tokens) but leaves 1.9 GiB beside vLLM, too thin next to the FSDP worker's context.
# Decode: 125 / 566 / 759 / 896 / 995 tok/s at concurrency 1/8/16/32/64 with 1024-token responses;
# 4096-token responses saturate at ~285 tok/s from concurrency 8 up (Triton attention at long context +
# preemption), so max_num_seqs 32 is the knee. Update phase (vLLM asleep) is budgeted at ~9-9.5 GiB.
trainer:
  n_gpus_per_node: 1
actor_rollout_ref:
  rollout:
    tensor_model_parallel_size: 1    # one replica = the whole world  [checked: == n_gpus_per_node]
    gpu_memory_utilization: 0.80
    max_num_seqs: 32
    max_num_batched_tokens: 4096     # >= max_prompt_length (chunked prefill); half the workspace of 8192
    agent:
      num_workers: 2                 # Ray actors, ~0.7 GB RSS each; one replica to feed
data:
  dataloader_num_workers: 2          # 10 cores
ray_kwargs:
  ray_init:
    num_cpus: 16                     # LOGICAL cpus for placement, not a cap: Ray itself reserves ~10
                                     # (TaskRunner 1, worker bundle 3, vLLM server 1, agent workers 2,
                                     # TransferQueue controller + storage units); <= 10 deadlocks placement.
                                     # The SLURM cgroup (10 real cores) is what limits actual use.
    object_store_memory: 4000000000  # 4 GB of the 30 GB cgroup (a step's TransferQueue payload is ~1 GB)
transfer_queue:
  backend:
    SimpleStorage:
      num_data_storage_units: 2      # verl default 8: one node, eight actors cost ~2.4 GB RSS and 8 cpus

# @package _global_
# Hardware profile h100: one NVIDIA H100 SXM 80 GB on Jarvislabs (cc 9.0, bf16; decision 013).
# Use with layout=h100_1gpu memory=plan_b_lora_gpu (configs/jarvis.env.sh passes all three).
#
# Precision: bf16 compute with fp32 LoRA masters (model_dtype fp32 in the memory plan), bf16 rollout.
# The 2080 Ti could only do fp16; bf16 has fp32's exponent range, so the fp16 stability ladder (006)
# does not apply here. The attention implementation stays SDPA without remove-padding: the pinned
# environment has no flash-attn package, and it keeps the training forward identical to the Ada runs.
# On cc 9.0 torch's SDPA uses its fused kernels and vLLM uses FLASH_ATTN.
hw_profile: h100
actor_rollout_ref:
  model:
    use_remove_padding: false        # no flash-attn package in the pinned env (SDPA + fused log-prob kernel)
    override_config:
      attn_implementation: sdpa
  actor:
    ppo_max_token_len_per_gpu: 32768 # 80 GB: ~5 max-length sequences per micro-batch (6144 on 11 GiB)
    fsdp_config:
      dtype: bfloat16
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: fp32
        buffer_dtype: fp32
  ref:
    log_prob_max_token_len_per_gpu: 65536   # forward only
    fsdp_config:
      dtype: bfloat16
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: fp32
        buffer_dtype: fp32
  rollout:
    dtype: bfloat16
    log_prob_max_token_len_per_gpu: 65536
    engine_kwargs:
      vllm:
        attention_backend: FLASH_ATTN
